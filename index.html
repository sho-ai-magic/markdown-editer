<div id="settings-overlay" hidden>
  <div id="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <h2 id="settings-title">設定</h2>
    <h3 class="settings-section">エディタ</h3>
    <div class="setting-row">
      <label for="pref-font-size">文字サイズ (px)</label>
      <input type="number" id="pref-font-size" data-pref-key="fontSize" min="12" max="24" step="1">
    </div>
    <div class="setting-row">
      <label for="pref-line-height">行間</label>
      <input type="number" id="pref-line-height" data-pref-key="lineHeight" min="1.4" max="2.2" step="0.1">
    </div>
    <h3 class="settings-section">保存</h3>
    <div class="setting-row">
      <label for="pref-auto-save">自動保存（入力が止まって3秒後に上書き保存）</label>
      <input type="checkbox" id="pref-auto-save" data-pref-key="autoSave">
    </div>
    <h3 class="settings-section">色</h3>
    <div class="setting-row">
      <label for="color-heading">見出しの色</label>
      <input type="color" id="color-heading" data-color-key="heading">
    </div>
    <div class="setting-row">
      <label for="color-list">リストの色</label>
      <input type="color" id="color-list" data-color-key="list">
    </div>
    <div class="setting-row">
      <label for="color-quote">引用の色</label>
      <input type="color" id="color-quote" data-color-key="quote">
    </div>
    <div class="setting-row">
      <label for="color-code">コードの色</label>
      <input type="color" id="color-code" data-color-key="code">
    </div>
    <div class="setting-row">
      <label for="color-table-border">表の罫線の色</label>
      <input type="color" id="color-table-border" data-color-key="tableBorder">
    </div>
    <div class="setting-row">
      <label for="color-rp-accent-1">プレビューのアクセントカラー1</label>
      <input type="color" id="color-rp-accent-1" data-color-key="rpAccent1">
    </div>
    <div class="setting-row">
      <label for="color-rp-accent-2">プレビューのアクセントカラー2</label>
      <input type="color" id="color-rp-accent-2" data-color-key="rpAccent2">
    </div>
    <div class="settings-actions">
      <button id="btn-reset-colors">既定の色に戻す</button>
      <button id="btn-close-settings">閉じる</button>
    </div>
  </div>
</div>

<input type="file" id="file-input" accept=".md,.markdown,.txt,text/markdown,text/plain" hidden>

<script src="vendor/codemirror/dialog.js"></script>
<script src="vendor/codemirror/searchcursor.js"></script>
<script src="vendor/codemirror/search.js"></script>
<script src="vendor/markdown-it.min.js"></script>
<script type="module" src="js/app.js"></script>
